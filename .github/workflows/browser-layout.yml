name: Browser Layout QA
on:
  push:
  pull_request:
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Test desktop and mobile page geometry
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > /tmp/wealthrank-streamlit.log 2>&1 &
          python tests/browser_layout.py || (cat /tmp/wealthrank-streamlit.log && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wealthrank-layout-screenshots
          path: layout-screenshots/
          if-no-files-found: ignore
